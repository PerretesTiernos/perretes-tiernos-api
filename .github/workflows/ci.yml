name: CI — Tests, Migrations & OpenAPI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  validate-and-test:
    name: Lint, Migrations & Pytest (Python 3.13)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
          POSTGRES_DB: perretes_tiernos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres_test_password@localhost:5432/perretes_tiernos_test
      REDIS_URL: redis://localhost:6379/0
      SUPABASE_URL: https://test-project.supabase.co
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_JWT_SECRET: test-super-secret-jwt-key-at-least-32-bytes-long
      SUPABASE_JWT_AUDIENCE: authenticated

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Test Alembic Migrations (Upgrade -> Downgrade -> Upgrade)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Verify OpenAPI Spec is Up-to-Date
        run: |
          python -m scripts.generate_openapi --check

      - name: Run Automated Test Suite (Unit + Integration)
        run: |
          pytest --cov=app --cov-report=term-missing

